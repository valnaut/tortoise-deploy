# The build of every image, which the build workflow passes to
# docker-deploy-workflows.
# See:
# https://github.com/mserajnik/docker-deploy-workflows/blob/v1/docs/deploy-yaml.md

primary-source: core

# A `pin` is the commit at which the watched files were last reviewed. After
# updating the local copies, set it to the commit a failing check suggests.
sources:
  core:
    repository: tortoise-wow/tortoise-wow
    branch: main
    pin: d9bbcd598a98a41fbf39cae5d630dd72b790d10f
    cutoff: 7efe82e09c2dfa7d00b96dd20eb12e0496f4ab61
  tortoisebots:
    repository: TortoiseBots/TortoiseBots
    branch: main
    pin: 3342fe2decd2d1f254c700349bde34c69a566fcc
    cutoff: 7fbbf910eeec1cf8eca2ded08d172150c03a3b88
  ahbot:
    repository: tortoise-modules/tw-mod-ah-bot-plus
    branch: master
    pin: e8b8c70f2c5baaa5bf8ebb09882c214b944096cd
  aoeloot:
    repository: tortoise-modules/tw-mod-aoe-loot
    branch: master
    pin: c14a8ebb4b87bc010dff674454bb683bbbbc84d1
  camps:
    repository: Ildourol/mod-twow-camps
    branch: main
    pin: 5519eba9c377714e390b74ef194e97b3ea09c485
    cutoff: 5519eba9c377714e390b74ef194e97b3ea09c485

# The server build checks the module configuration files and the module SQL it
# installs against the `module-configs` and `module-sql-modules` vars of each
# variant.
variants:
  modules-custom:
    sources: [core, tortoisebots, ahbot, aoeloot, camps]
    vars:
      modules: "TortoiseBots={url:tortoisebots}@{commit:tortoisebots}|tw-mod-ah-bot-plus={url:ahbot}@{commit:ahbot}|tw-mod-aoe-loot={url:aoeloot}@{commit:aoeloot}|mod-twow-camps={url:camps}@{commit:camps}"
      module-configs: aiplayerbot.conf,modules/mod-twow-camps.conf,modules/mod_ahbot.conf,modules/tortoise_bots.conf,modules/tw-mod-aoe-loot.conf
      module-sql-modules: TortoiseBots,mod-twow-camps
      module-build-packages: libboost-dev libboost-filesystem-dev
      server-licenses: AGPL-3.0-only AND AGPL-3.0-or-later AND GPL-2.0-or-later

vars:
  modules: ""
  module-configs: ""
  module-sql-modules: ""
  module-build-packages: ""
  server-licenses: AGPL-3.0-only AND AGPL-3.0-or-later AND GPL-2.0-or-later

diff:
  upstreams:
    # Bump the commit in `docker/database/Dockerfile` and in the header of
    # `docker/database/docker-entrypoint.sh` along with this pin.
    mariadb:
      repository: MariaDB/mariadb-docker
      branch: master
      pin: 063eb10da092170beea08d2c629b6eb79d28cceb
  # A change upstream that breaks a patch already fails the build.
  checks:
    - source: core
      files: [CMakeLists.txt, sql/base/tw_world_migrations.sql, sql/create_databases.sql, src/mangosd/mangosd.conf.dist.in, src/realmd/realmd.conf.dist.in, tools/BuildEverything.bat, tools/dbc_verification/dbc_verifier.py]
    # The module configuration templates are the sources of the
    # `*.conf.example` files under `config/`.
    - {source: tortoisebots, files: [ai/playerbot/aiplayerbot.conf.dist.in, conf/tortoise_bots.conf.dist]}
    - {source: ahbot, files: [conf/mod_ahbot.conf.dist]}
    - {source: aoeloot, files: [conf/tw-mod-aoe-loot.conf.dist]}
    - {source: camps, files: [conf/mod-twow-camps.conf.dist]}
    # `docker/database/docker-entrypoint.sh` builds on this entrypoint.
    - {source: mariadb, files: [12.3/docker-entrypoint.sh]}

# A rule has to watch or exclude every file that a `claim` matches, or the run
# fails.
migration-edits:
  targets:
    world:
      remedy: recreate
      sources:
        core:
          migrations: [sql/database_updates/*.sql, sql/database_updates/world/*.sql]
          base: [sql/base/tw_world_*.sql]
          exclude: [sql/base/tw_world_migrations.sql, sql/database_updates/*/cn/*.sql]
          claim: [sql/base/**/*.sql, sql/database_updates/**/*.sql]
        tortoisebots:
          migrations: [data/sql/world/*.sql]
          claim: [data/sql/**/*.sql]
        camps:
          migrations: [data/sql/world/*.sql]
          claim: [data/sql/**/*.sql]
    character:
      remedy: manual
      sources:
        core: {migrations: [sql/database_updates/character/*.sql]}
        tortoisebots: {migrations: [data/sql/character/*.sql]}

images:
  - name: server
    package: tortoise-server
    dockerfile: docker/server/Dockerfile
    tags: ["{variant}-{commit:core}", "{variant}"]
    build-args:
      TORTOISE_REVISION: "{commit:core}"
      TORTOISE_FAIL_ON_PATCH_ERROR: "1"
      TORTOISE_MODULES: "{var:modules}"
      TORTOISE_MODULE_CONFIGS: "{var:module-configs}"
      TORTOISE_MODULE_SQL_MODULES: "{var:module-sql-modules}"
      TORTOISE_MODULE_BUILD_PACKAGES: "{var:module-build-packages}"
    oci:
      title: tortoise-deploy - Tortoise-WoW server image
      description: Tortoise-WoW is an open-source restoration of Turtle WoW 1.18.1.7272.
      base-name: ubuntu:26.04
      licenses: "{var:server-licenses}"
      version: "{commit:core}"

  - name: database
    package: tortoise-database
    dockerfile: docker/database/Dockerfile
    tags: ["{variant}-{commit:core}", "{variant}"]
    build-args:
      TORTOISE_REVISION: "{commit:core}"
      TORTOISE_MIGRATION_EDITS: "{migration-edits}"
    oci:
      title: tortoise-deploy - Tortoise-WoW database image
      description: Database for the Tortoise-WoW server.
      base-name: mariadb:12.3
      licenses: AGPL-3.0-only AND AGPL-3.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later
      version: "{commit:core}"